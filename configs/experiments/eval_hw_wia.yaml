# Hyundai WIA (QA_report_HW.pdf) full matrix evaluation
name: eval_hw_wia
description: >
  Evaluate text vs multimodal RAG × page vs hierarchical retrieval
  on length-truncated Hyundai WIA quarterly report packs (5/20/50/100).
seed: 42

datasets:
  - custom_5
  - custom_20
  - custom_50
  - custom_100

pipelines:
  - text
  - multimodal

retrievals:
  - page
  - hierarchical

top_k: [3]
coarse_k: 5
max_images: 3

index_variants:
  page: page_text
  hierarchical: hier_text

generation:
  max_tokens: 128
  temperature: 0.1

model: models/gemma3_4b_qat.yaml

system_metrics:
  track_rss: true
  track_vram: true

skip_missing_dataset: true
skip_missing_index: true
skip_missing_artifact: true

device: cpu
dry_run: false

output_dir: results/runs
report_dir: results/reports
figures_dir: results/figures

metrics:
  primary: anls
  ks: [1, 3, 5]
